    <text x="806" y="119" fill="#F8FAFC" font-size="17" font-weight="700">Open Source</text>
    <text x="806" y="137" fill="#94A3B8" font-size="12.5">Modular Android architectures, SDKs &amp; auth libraries</text>

    <text x="806" y="166" fill="#F8FAFC" font-size="17" font-weight="700">jeyk.dev</text>
    <text x="806" y="184" fill="#94A3B8" font-size="12.5">Portfolio &amp; case studies</text>
