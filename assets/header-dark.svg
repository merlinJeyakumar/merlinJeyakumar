<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title description">
  <title id="title">Merlin Jeyakumar, Mobile Systems Engineer</title>
  <desc id="description">A dark minimalist header for Merlin Jeyakumar, a Mobile Systems Engineer based in Dubai, UAE.</desc>
  <defs>
    <linearGradient id="top-accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="0.60" stop-color="#7DD3FC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dot-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7DD3FC" opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1200" height="240" fill="#0D1117"/>
  <rect x="12" y="12" width="1176" height="216" rx="12" fill="#0B1220" stroke="#1E293B"/>
  <path d="M 28 13 H 1172" stroke="url(#top-accent)" stroke-width="2"/>
  <rect x="708" y="29" width="430" height="182" fill="url(#dot-grid)"/>
  <path d="M 1100 42 h 38 v 38 M 1138 160 v 38 h -38" fill="none" stroke="#7DD3FC" stroke-opacity="0.10" stroke-width="1"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="68" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="1.55">MOBILE SYSTEMS ENGINEER · DUBAI, UAE</text>
    <text x="60" y="119" fill="#F8FAFC" font-size="40" font-weight="700" letter-spacing="-0.8">Merlin Jeyakumar</text>
    <text x="60" y="157" fill="#94A3B8" font-size="17">Kotlin · Android SDK · Jetpack Compose · Flutter · Regulated Fintech</text>
    <text x="60" y="193" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="0.8">MOBILE SYSTEMS · RELIABILITY · DELIVERY</text>

    <path d="M 770 48 V 192" stroke="#1E293B"/>
    <path d="M 806 96 H 1132 M 806 143 H 1132" stroke="#1E293B"/>

